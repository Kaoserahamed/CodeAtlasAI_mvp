# Local Neo4j for development and for the integration test suite, so that
# neither requires a Neo4j Desktop install or a hosted Aura instance.
#
#   docker compose up -d          # start the database
#   docker compose down -v        # stop and discard the stored graph
#
# The Graph Browser is then at http://localhost:7474 (bolt 7687).
# Credentials default to neo4j/codeatlas-local and are overridden by
# NEO4J_USER and NEO4J_PASSWORD if those are set in the environment.
services:
  neo4j:
    image: neo4j:5-community
    container_name: codeatlas-neo4j
    restart: unless-stopped
    ports:
      - '7474:7474' # HTTP: browser and health endpoint
      - '7687:7687' # Bolt: the driver connects here
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-codeatlas-local}
      # Bounded heap and page cache: the default sizing is sized for a server,
      # not for a laptop that is also running a browser and an editor.
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    healthcheck:
      # Neo4j needs a moment after the port opens before it answers queries,
      # so the check queries the server rather than just dialing the socket.
      test:
        [
          'CMD-SHELL',
          'wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      # Roughly two minutes: enough for the first boot on a cold image.
      start_period: 30s

volumes:
  neo4j-data:
  neo4j-logs: