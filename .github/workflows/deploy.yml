name: Deploy to GitHub Pages

# Gated on the CI workflow rather than on a raw push. `needs:` only orders
# jobs inside one workflow, so the cross-workflow gate is workflow_run: the
# deploy starts only after CI has finished successfully on main.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    # Skip when CI concluded anything other than success, so a red run cannot
    # publish. The event carries the run's conclusion, not the workflow's.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # workflow_run reports the workflow file from the default branch but
        # must check out the commit that actually passed CI.
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        working-directory: ./frontend
        run: npm install

      - name: Build demo
        working-directory: ./frontend
        env:
          # Vite inlines build-time env vars into the bundle, so this value is
          # baked into the deployed artifact and cannot be supplied at runtime.
          # It is provided by CI rather than a tracked .env file so that
          # repository clones stay free of environment-specific configuration.
          # The demo still works without it: the client falls back to /api.
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: npm run build:demo
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './frontend/dist'
  
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
